# Alembic configuration.
#
# The database URL is deliberately NOT set here. env.py takes it from
# src.database.session, so migrations resolve DATABASE_URL / USE_SQLITE exactly
# the way the application does — one source of truth, and no chance of running a
# migration against a different database than the app talks to.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Migration filenames are prefixed with a zero-padded sequence so `ls` shows
# them in the order they run.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
